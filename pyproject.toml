[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-parser"
dynamic = ["version"]
description = "Catch-up RSS collector for Russian state media"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Scykorr" }]
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "trafilatura>=1.12",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fast-parser = "fast_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "fast_parser.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]
filterwarnings = [
    "ignore:SOCKS support in urllib3 requires the installation of optional dependencies:Warning",
]
