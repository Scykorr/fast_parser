<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true}]}'>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}fast_parser{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="mast">
    <div class="mast-inner">
      <a class="brand" href="/">fast_parser</a>
      <nav>
        <a href="/">Лента</a>
        <a href="/sources">Источники</a>
        <a href="/regions">Регионы</a>
        <a href="/stats">Сводка</a>
        <a href="/docs">API</a>
      </nav>
      <form class="collect" method="post" action="/collect" hx-post="/collect" hx-target="#collect-status" hx-swap="innerHTML">
        <button type="submit">Собрать сейчас</button>
      </form>
    </div>
    <p id="collect-status" class="collect-status">Версия {{ version }}. Сбор идёт только по кнопке, сервис сам по себе не крутится.</p>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
