{% extends "base.html" %}
{% block title %}Лента — fast_parser{% endblock %}
{% block body %}
<section class="panel">
  <h1>Лента</h1>
  <form class="filters" method="get" action="/"
        hx-get="/" hx-target="#feed" hx-push-url="true" hx-trigger="change, submit">
    <label>Источник
      <select name="source_id">
        <option value="">Все</option>
        {% for source_id, name in choices.sources %}
        <option value="{{ source_id }}" {% if filters.source_id == source_id %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Тип
      <select name="source_type">
        <option value="">Все</option>
        {% for kind in choices.types %}
        <option value="{{ kind }}" {% if filters.source_type == kind %}selected{% endif %}>{{ kind }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Регион
      <select name="region_code">
        <option value="">Все</option>
        {% for code, name in choices.regions %}
        <option value="{{ code }}" {% if filters.region_code == code %}selected{% endif %}>{{ code }} {{ name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Округ
      <select name="federal_district">
        <option value="">Все</option>
        {% for district in choices.districts %}
        <option value="{{ district }}" {% if filters.federal_district == district %}selected{% endif %}>{{ district }}</option>
        {% endfor %}
      </select>
    </label>
    <label>С даты <input type="date" name="date_from" value="{{ filters.date_from or '' }}"></label>
    <label>По дату <input type="date" name="date_to" value="{{ filters.date_to or '' }}"></label>
    <label>Текст <input type="search" name="q" value="{{ filters.text or '' }}" placeholder="слово в заголовке или тексте"></label>
    <label>Категория <input name="category" value="{{ filters.category or '' }}" placeholder="появится позже"></label>
    <label>Тональность
      <select name="sentiment">
        <option value="">Любая</option>
        {% for sentiment in choices.sentiments %}
        <option value="{{ sentiment }}" {% if filters.sentiment == sentiment %}selected{% endif %}>{{ sentiment }}</option>
        {% endfor %}
      </select>
    </label>
    <label>fake_score от <input type="number" step="0.01" min="0" max="1" name="fake_score_min" value="{{ filters.fake_score_min if filters.fake_score_min is not none else '' }}"></label>
    <label>fake_score до <input type="number" step="0.01" min="0" max="1" name="fake_score_max" value="{{ filters.fake_score_max if filters.fake_score_max is not none else '' }}"></label>
    <button type="submit">Показать</button>
  </form>
  <p class="hint">Рубрика ставится сразу по словам и RSS. Тональность появляется после extra <code>ml</code>, fake_score — на следующем этапе. Фильтры уже работают.</p>
</section>
<div id="feed">
  {% include "feed_list.html" %}
</div>
{% endblock %}
